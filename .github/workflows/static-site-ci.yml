name: FieldPack Pro Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'p0/**', 'fix/**', 'chore/**']

permissions:
  contents: read

concurrency:
  group: fieldpackpro-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate static site contracts
        run: python3 scripts/validate_site.py
